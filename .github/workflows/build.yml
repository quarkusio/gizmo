name: Gizmo 2 CI

on:
  push:
    branches-ignore:
      - 'dependabot/**'
    paths-ignore:
      - '.github/project.yml'
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: "Build with JDK ${{ matrix.distribution }} on ${{ matrix.os }}"
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        distribution: [temurin, semeru]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDKs
        uses: actions/setup-java@1bcf9fb12cf4aa7d266a90ae39939e61372fe520 # v5.4.0
        with:
          distribution: ${{ matrix.distribution }}
          java-version: |
            17
            21
            25
          cache: maven

      - name: Build with Maven
        run: mvn -B clean package -Dno-format -Djava17.home="${{env.JAVA_HOME_17_X64}}${{env.JAVA_HOME_17_ARM64}}" -Djava21.home="${{env.JAVA_HOME_21_X64}}${{env.JAVA_HOME_21_ARM64}}" -Djava25.home="${{env.JAVA_HOME_25_X64}}${{env.JAVA_HOME_25_ARM64}}"
